[globals]
# Sets global settings
load_data = True
; experiment_name = tl016
; working_directory = /mirror2/scratch/kelvinw/TL016B/working_directory/
experiment_name = n14c3
working_directory = /mirror2/scratch/kelvinw/n14c3/working_directory
; telescope = VLBA
telescope = EVN
; leave empty unless you want to calibrate UVFITS exported from AIPS in CASA
uvfits_file = 
use_singularity = False
aoflagger_path = /mirror/scratch/kelvinw/singularity_containers/aoflagger-v2.14.0.sif
wsclean_sif = /mirror2/scratch/kelvinw/singularity_containers/wsclean_working.simg
singularity_container = 

[apriori]
use_casa = True
attach_metadata = True
; fitsfiles_dir = /mirror2/scratch/kelvinw/TL016B
; antab_file = 
fitsfiles_dir = /mirror2/scratch/kelvinw/n14c3
antab_file = /mirror2/scratch/kelvinw/n14c3/n14c3.antab

; apriori flagging tables generated by the observatory (EVN)
uvflg_file = 
do_apriori_cal = True
apply_apriori_cal = True

[basic]

; target =  J1203+6031
; phase_calibrator = J1154+6022
; fringe_finder =  4C39.25
integration_time = 2

target = J1849+3024	
phase_calibrator = 1848+283
fringe_finder = 1848+283


do_split =  False
timebin = 2
width = 8
verbosity = False

[flagging]
do_flagging =   True
use_aoflagger = True
; if flagging strategy not provided default to default strategies in ./data/flagging
flagging_strategy = 
manual_file = 
edge_channel_fraction = 0.02
flag_antenna = False
antenna_to_flag = 

[calibrate]
do_tec_corrections = False
do_sbd_fringe = True
apply_sbd = True
; refant = FD,PT
refant = EF
timerange = 

snr_sbd = 7
do_mbd_fringe =  True
apply_mbd = True
snr_mbd = 7
solint = 30
do_bpass = True
apply_bpass = True
make_dirty_map = True
use_tclean = False
use_wsclean = True


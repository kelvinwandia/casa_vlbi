[globals]
# Sets global settings
set_user = 5
experiment_name = n14c3
; working_directory =  /raid1/scratch/kelvinw/aips_dir
working_directory = /raid1/scratch/kelvinw/n14c3_working_dir
start_tv = False
indisk = 1 
inseq = 1
inclass = UVDATA


[load_data]
zap_data = False
load_data = False
; fitsfiles_directory = /raid1/scratch/kelvinw/gv020_fitsfiles/gv020a_fitsfiles
fitsfiles_directory = /raid1/scratch/kelvinw/n14c3_fitsfiles
idifitsfiles = IDI
file_extension_for_flagging = FITS
file_extension_for_cal = FITS
; tasav_file = gv020b_1.tasav.FITS
; tasav_file = gv020b_1.tasav.FITS
tasav_file = n14c3.tasav.FITS
pointing = 1
integration_time = 2

[sources]
; phase_calibrator = J2139+1423
; target = M15
; fringe_finder = 3C454.3

phase_calibrator = 1848+283
target = J1849+3024
fringe_finder = 1848+283


[flagging]
do_flagging = True
use_aoflagger = True
aoflagger_sif = /raid1/scratch/kelvinw/singularity_containers/lofar_aoflagger_3.1.0.sif

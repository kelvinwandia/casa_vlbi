; manual_file = /raid1/scratch/kelvinw/casa_vlbi/data/flagging/gv020a_final.flag
manual_file = 

[calibrate]
refant = EF
; searchants = JB,WB,MC
searchants = JB,WB
do_amp_parang_correction = True
do_tec_correction = True
do_singleband_fring = True
; fring_timerange = 0,19,38,0,0,19,39,0
; fring_timerange = 0,14,58,30,0,14,59,30
; fring_timerange = 0,13,53,20,0,13,54,20
; fring_timerange = 0,14,48,0,14,49,0 # epoch e
fring_timerange = 0,13,15,0,0,13,20,0 
apply_singleband_corrections = True
do_global_fring = True
fring_solint = 1
fring_snr = 7
apply_global_fring_corrections = True
do_bandpass = True
apply_bpass_corrections = True

[split]
do_splat = True
write_fits = True

[selfcal]
; split_selfcal = True
make_dirty_map = True
do_selfcal = True
use_tclean = False
use_wsclean = True
wsclean_sif = /raid1/scratch/kelvinw/singularity_containers/wsclean_working.simg
; wsclean_sif = /home/kelvin/Desktop/singularity/wsclean-v3.3-no-cuda.sif 
pybdsf_threshold = 4
pybdsf_niter = 1
cell = 1mas
imsize = 640,640
nloops = 2
; nloops = 1
calmode = p,ap
; calmode = p
gaintype= T,T
; gaintype = T
solint_selfcal = 90s,300s
; solint_selfcal = inf
threshold = 9,7
tclean_threshold = 30mJy

; threshold = 10
minsnr = 3,3
; minsnr = 3
niter = 100000
niter_final = 100000
threshold_final = 3

robust = 0.5

spw = 17 
abs_mem = 4 
weighting=briggs
detection_threshold = 4.0
apply_to_target = False
detect_sources = False



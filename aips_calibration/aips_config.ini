[globals]
# Sets global settings
set_user = 5
experiment_name = gv020b
working_directory =  /raid1/scratch/kelvinw/gv020_working_dir/gv020b_working_dir
start_tv = False
indisk = 1 
inseq = 1
inclass = UVDATA


[load_data]
zap_data = True
load_data = True
fitsfiles_directory = /raid1/scratch/kelvinw/gv020_fitsfiles/gv020b_fitsfiles
idifitsfiles = IDI
file_extension_for_flagging = FITS
file_extension_for_cal = FITS
tasav_file = gv020b_1.tasav.FITS
; tasav_file = gv020a.tasav.FITS
pointing = 1
integration_time = 0.5

[sources]
phase_calibrator = J2139+1423
target = M15PSRC
fringe_finder = 3C454.3

[flagging]
do_flagging = True
aoflagger_sif = /raid1/scratch/kelvinw/singularity_containers/lofar_aoflagger_3.1.0.sif
flagging_strategy = /raid1/scratch/kelvinw/casa_vlbi/data/flagging/generic_strategy.lua

[calibrate]
refant = EF
searchants = JB,WB,MC
do_amp_parang_correction = True
do_tec_correction = True
do_singleband_fring = True
; fring_timerange = 0,19,38,0,0,19,39,0
fring_timerange = 0,14,58,30,0,14,59,30
apply_singleband_corrections = True
do_global_fring = True
fring_solint = 1
fring_snr = 7
apply_global_fring_corrections = True
do_bandpass = True
apply_bpass_corrections = True

apply_all_calibrations = True

[split]
do_splat = True
write_fits = True

[selfcal]
make_dirty_map = True
do_selfcal = True
use_tclean = False
use_wsclean = True
wsclean_sif = /raid1/scratch/kelvinw/singularity_containers/wsclean_working.simg
pybdsf_threshold = 4
pybdsf_niter = 1
cell = 1 mas
imsize = 256,256
nloops = 3
; nloops = 1
calmode = p,p,ap
; calmode = p
gaintype= T,T,T
; gaintype = T
solint_selfcal = inf,45,270s
; solint_selfcal = inf
threshold = 9,7,5
tclean_threshold = 30mJy

; threshold = 10
minsnr = 3,3,3
; minsnr = 3
niter = 100000
niter_final = 100000
threshold_final = 3

robust = 0.5

spw = 17 
abs_mem = 4 
weighting=briggs
detection_threshold = 4.0
apply_to_target = False
detect_sources = False


